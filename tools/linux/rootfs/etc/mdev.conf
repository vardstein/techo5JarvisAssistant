# Device nodes mdev makes with something other than its default (root:root 0660).
#
# camera-isp maps more than the camera: its mmap windows include the SoC clock controller
# (topckgen), GPIO and the eFuses, and the camera code writes the clock controller through it.
# kd_camera_hw powers the sensors and ion hands out physical memory. Root only.
camera-isp	root:root 0600
kd_camera_hw	root:root 0600
ion	root:root 0600

# The recipe page: the recipe Jarvis last looked up, ingredients on the
# left and steps on the right. Make it a dashboard of its own at the
# address jarvis-rezept, which is how the Show finds it
# (docs/recipes.md). It needs a recipe search in Genbu Assistant and
# jarvis-recipe-card.js; see README.md.
#
# The card fills the screen by itself and sizes its text to it, so there
# is nothing to set. A sensor other than sensor.genbu_recipe goes under
# entity.
views:
  - title: Rezept
    path: rezept
    type: panel
    cards:
      - type: custom:jarvis-recipe-card
        entity: sensor.genbu_recipe

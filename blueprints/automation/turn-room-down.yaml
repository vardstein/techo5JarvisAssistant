blueprint:
  name: Turn the room down while a Show listens
  description: >-
    While a voice assistant (a Jarvis Show, or any other) listens, thinks and answers, the speakers
    you pick are turned almost all the way down, so the music in the room doesn't end up in what it
    hears and you can hear the answer. They stay down for the whole conversation, follow-up
    questions included, and come back up once it has been quiet for a few seconds.

    Pick no speakers and it turns down the speakers in whatever room the assistant is in when it
    starts listening, so a Show moved to another room needs nothing changed here.

    A speaker that can't be turned down (no volume control in Home Assistant) is paused instead and
    started again once the conversation is over, unless somebody paused or stopped music during it.

    A speaker that isn't playing is left alone. One stepped up or down during the turn ("lauter",
    "leiser") comes back to its old volume plus that step, and one set outright ("Lautstärke auf
    30", a slider) keeps what it was set to. The Show turns down what it plays itself, so don't pick
    its own speaker.

    With a Show's "Wake word near miss" picked, the speakers also go down when it nearly heard its
    wake word, so the second try isn't up against the music. Nobody trying again within a few
    seconds brings them back up.
  domain: automation
  source_url: https://github.com/vardstein/techo5JarvisAssistant/blob/genbuShowCrown/blueprints/automation/turn-room-down.yaml
  input:
    satellite:
      name: Voice assistant
      selector:
        entity:
          filter:
            - domain: assist_satellite
    speakers:
      name: Speakers to turn down (optional)
      description: >-
        Leave empty for the speakers in the assistant's room, worked out each time. Or pick them
        yourself; then, when Music Assistant and the speaker's own integration both have an entity
        for the same speaker, pick only one, or it is turned down twice.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    part:
      name: Turned down to
      description: >-
        How much of its volume a speaker keeps during the conversation. 10 % leaves the music just
        audible; 0 mutes it.
      default: 10
      selector:
        number:
          min: 0
          max: 90
          step: 5
          unit_of_measurement: "%"
    quiet:
      name: Back up after
      description: >-
        How long the assistant has to be idle first. Shorter than the pause before a follow-up,
        and the follow-up starts with the music up again.
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: s
    near_miss:
      name: Wake word near miss (optional)
      description: >-
        The Show's "Wake word near miss" event. Leave empty to turn the room down only once it is
        listening.
      default: ""
      selector:
        entity:
          filter:
            - domain: event

# A turn that opens while the speakers are down is part of the same run.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input satellite
    from: idle
    to: listening
    id: turn
  # An event entity's state is when it last fired. Matched on the event rather than a state trigger
  # so the input can be left empty.
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input near_miss
    id: near_miss

variables:
  satellite: !input satellite
  picked: !input speakers
  # The picked ones, or the room's media players now: less any on a device with a voice assistant
  # and any Show's own Music Assistant player (the Shows turn down what they play themselves), and a
  # speaker both Music Assistant and its own integration have an entity for only through its own one.
  speakers: >-
    {% set picked = [picked] if picked is string else (picked or []) | list %}
    {% if picked | count > 0 %}{{ picked }}{% else %}
    {% set a = area_id(satellite) %}
    {% set ns = namespace(out=[]) %}
    {% for e in (area_entities(a) if a else []) | select('match', 'media_player[.]')
       if not is_state(e, 'unavailable') %}
      {% set d = device_id(e) %}
      {% if not d or (device_entities(d) | select('match', 'assist_satellite[.]') | list | count == 0
                      and device_attr(d, 'manufacturer') not in ['OpenJade', 'TECHO5']) %}
        {% set ns.out = ns.out + [e] %}
      {% endif %}
    {% endfor %}
    {% set native = ns.out | reject('in', integration_entities('music_assistant')) | list %}
    {{ native if native else ns.out }}{% endif %}
  part: !input part
  quiet: !input quiet
  # Playing and able to have its volume set (VOLUME_SET is 4 in supported_features).
  was: >-
    {% set ns = namespace(out={}) %}
    {% for s in speakers if is_state(s, 'playing') and state_attr(s, 'volume_level') is number
       and (state_attr(s, 'supported_features') | int(0)) | bitwise_and(4) > 0 %}
      {% set ns.out = dict(ns.out, **{s: state_attr(s, 'volume_level')}) %}
    {% endfor %}
    {{ ns.out }}
  # Playing with no volume to turn down, and able to pause (PAUSE is 1): paused for the turn instead.
  paused: >-
    {% set ns = namespace(out=[]) %}
    {% for s in speakers if is_state(s, 'playing') and s not in was
       and (state_attr(s, 'supported_features') | int(0)) | bitwise_and(1) > 0 %}
      {% set ns.out = ns.out + [s] %}
    {% endfor %}
    {{ ns.out }}
  down: >-
    {% set ns = namespace(out={}) %}
    {% for s, v in was.items() %}
      {% set ns.out = dict(ns.out, **{s: (v * part / 100) | round(2)}) %}
    {% endfor %}
    {{ ns.out }}

conditions:
  - condition: template
    value_template: "{{ was | count > 0 or paused | count > 0 }}"
  # A near miss counts while nothing else is going on, and only a real one: a Show coming back after a
  # restart puts the event's last time back, from unavailable.
  - condition: template
    value_template: >-
      {{ trigger.id != 'near_miss' or (
           is_state(satellite, 'idle')
           and trigger.event.data.old_state is not none
           and trigger.event.data.old_state.state != 'unavailable'
           and trigger.event.data.new_state is not none
           and trigger.event.data.new_state.state not in ['unavailable', 'unknown']) }}

actions:
  - repeat:
      for_each: "{{ down | list }}"
      sequence:
        - action: media_player.volume_set
          target:
            entity_id: "{{ repeat.item }}"
          data:
            volume_level: "{{ down[repeat.item] }}"
          continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ paused | count > 0 }}"
    then:
      - action: media_player.media_pause
        target:
          entity_id: "{{ paused }}"
        continue_on_error: true
  # After a near miss, the second try has a few seconds to start. If it doesn't, the music comes
  # back up without waiting for a conversation that isn't coming.
  - if:
      - condition: template
        value_template: "{{ trigger.id == 'near_miss' }}"
    then:
      - wait_for_trigger:
          - trigger: state
            entity_id: !input satellite
            from: idle
        timeout:
          seconds: 8
  - variables:
      talked: "{{ trigger.id != 'near_miss' or wait.trigger is not none }}"
  # Until it has been idle for the whole of quiet. Each time round it works out from the state how
  # long that still is, so a turn that was over before this got here counts too, and starts again
  # whenever the assistant goes idle or stops being idle. Only those two: a wait that ended at every
  # listening, processing and responding would be between two waits just when "Lautstärke auf 30"
  # comes in, a few milliseconds after processing starts, and miss it. Five minutes without it going
  # idle is a stuck assistant, and the music comes back up anyway.
  #
  # Meanwhile it notes what was done to the speakers. Music paused or stopped by anybody during the
  # turn ("Musik aus", the Show's pause button) keeps the paused speakers paused afterwards.
  # "Lautstärke auf 30" and a slider both call
  # volume_set, which shows up as a call_service event: that speaker stays where it was put.
  # "Lautstärke hoch" from volume-where-the-music-is says how far it stepped in a techo5_volume_step
  # event first, then sets the lowered volume plus the step, which is not an outright set (same
  # context). A speaker that moved with neither was stepped some other way, and the step is read
  # off the volume.
  - variables:
      set_outright: []
      stepped: {}
      stay_paused: false
      step_contexts: []
  - if:
      - condition: template
        value_template: "{{ talked }}"
    then:
      - repeat:
          sequence:
            - variables:
                idle_for: >-
                  {{ (now() - states[satellite].last_changed).total_seconds()
                     if is_state(satellite, 'idle') else -1 }}
            - wait_for_trigger:
                - trigger: state
                  entity_id: !input satellite
                  to: idle
                - trigger: state
                  entity_id: !input satellite
                  from: idle
                - trigger: event
                  event_type: call_service
                  event_data:
                    domain: media_player
                    service: volume_set
                - trigger: event
                  event_type: techo5_volume_step
                - trigger: event
                  event_type: call_service
                  event_data:
                    domain: media_player
                    service: media_pause
                - trigger: event
                  event_type: call_service
                  event_data:
                    domain: media_player
                    service: media_stop
                - trigger: event
                  event_type: call_service
                  event_data:
                    domain: media_player
                    service: media_play_pause
                - trigger: event
                  event_type: call_service
                  event_data:
                    domain: media_player
                    service: turn_off
              timeout:
                seconds: "{{ [quiet - idle_for, 0.1] | max if idle_for >= 0 else 300 }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ wait.trigger is not none and wait.trigger.event is defined
                       and wait.trigger.event.event_type == 'techo5_volume_step' }}
              then:
                - variables:
                    stepped: >-
                      {% set e = wait.trigger.event.data.entity_id | default([]) %}
                      {% set e = [e] if e is string else e | list %}
                      {% set ns = namespace(out=stepped) %}
                      {% for s in e if s in was %}
                        {% set ns.out = dict(ns.out, **{s: (ns.out[s] | default(0)) + wait.trigger.event.data.by | float(0)}) %}
                      {% endfor %}
                      {{ ns.out }}
                    step_contexts: "{{ step_contexts + [wait.trigger.event.context.id] }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ wait.trigger is not none and wait.trigger.event is defined
                       and wait.trigger.event.event_type == 'call_service'
                       and wait.trigger.event.data.service == 'volume_set'
                       and wait.trigger.event.context.id not in step_contexts }}
              then:
                - variables:
                    set_outright: >-
                      {% set e = wait.trigger.event.data.service_data.entity_id | default([]) %}
                      {% set e = [e] if e is string else e | list %}
                      {{ (set_outright + (e | select('in', was) | list)) | unique | list }}
            - if:
                - condition: template
                  value_template: >-
                    {{ wait.trigger is not none and wait.trigger.event is defined
                       and wait.trigger.event.event_type == 'call_service'
                       and wait.trigger.event.data.service != 'volume_set' }}
              then:
                - variables:
                    stay_paused: true
          until:
            - condition: template
              value_template: "{{ wait.trigger is none or repeat.index > 100 }}"
  - repeat:
      for_each: "{{ was | list }}"
      sequence:
        - variables:
            moved: >-
              {{ stepped[repeat.item] if repeat.item in stepped
                 else state_attr(repeat.item, 'volume_level') | float(down[repeat.item]) - down[repeat.item] }}
        # Set outright, it stays. Otherwise back to where it was, plus whatever it was stepped by:
        # 0.62 turned down to 0.06 and stepped up by 0.1 comes back at 0.72.
        - if:
            - condition: template
              value_template: "{{ repeat.item not in set_outright }}"
          then:
            - action: media_player.volume_set
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: >-
                  {{ was[repeat.item] if moved | abs < 0.02
                     else ([[was[repeat.item] + moved, 0] | max, 1] | min) | round(2) }}
              continue_on_error: true
  # What was paused for the turn plays again, when it is still paused and nobody asked for quiet.
  - repeat:
      for_each: "{{ paused if not stay_paused else [] }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ is_state(repeat.item, 'paused') }}"
          then:
            - action: media_player.media_play
              target:
                entity_id: "{{ repeat.item }}"
              continue_on_error: true

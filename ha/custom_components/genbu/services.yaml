forget_show:
  fields:
    node:
      required: true
      example: kitchen-show
      selector:
        text:
install_updates:
  fields:
    except_node:
      required: false
      example: kitchen-show
      selector:
        text:
music_route:
  fields:
    show:
      required: false
      selector:
        device:
          integration: esphome
    player:
      required: false
      selector:
        entity:
          integration: music_assistant
          domain: media_player
show_key:
  fields:
    node:
      required: true
      example: kitchen-show
      selector:
        text:
    url:
      required: false
      example: http://homeassistant.local:8123
      selector:
        text:
